name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Build channel (test for stable operator channel, beta for internal testing, prod for official release)"
        required: false
        default: "beta"
        type: choice
        options:
          - test
          - beta
          - prod

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify OpenMinis foundation baseline
        run: bash scripts/verify-openminis-baseline.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Run source contract tests
        run: node --test tests/*.test.mjs

      - name: Build Vue frontend
        run: npm run build:frontend

      - name: Build CLI server
        run: npm run build:cli

      - name: Bundle server into APK assets
        run: bash android/scripts/build-server-bundle.sh

      - name: Download Termux bootstrap
        run: bash android/scripts/download-bootstrap.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare OpenMinis Android toolchain
        run: sdkmanager "platforms;android-36" "ndk;28.0.12433566" "cmake;3.22.1"

      - name: Build OpenMinis Alpine runtime
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12433566"
          cd third_party/OpenMinis
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          test -s src/android/app/src/main/assets/alpine-minirootfs.tar.gz
          test -x src/android/app/src/main/assets/proot-aarch64
          test -x src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          test -x src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -x src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed signing keystore
        run: |
          if [ -z "${{ secrets.ANYCLAW_SIGNING_STORE_BASE64 }}" ]; then
            echo "Missing repository secret ANYCLAW_SIGNING_STORE_BASE64"
            exit 1
          fi
          if [ -z "${{ secrets.ANYCLAW_SIGNING_STORE_PASSWORD }}" ]; then
            echo "Missing repository secret ANYCLAW_SIGNING_STORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.ANYCLAW_SIGNING_KEY_ALIAS }}" ]; then
            echo "Missing repository secret ANYCLAW_SIGNING_KEY_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.ANYCLAW_SIGNING_KEY_PASSWORD }}" ]; then
            echo "Missing repository secret ANYCLAW_SIGNING_KEY_PASSWORD"
            exit 1
          fi
          mkdir -p android/signing
          echo "${{ secrets.ANYCLAW_SIGNING_STORE_BASE64 }}" | base64 -d > android/signing/pocket-lobster-release.p12

      - name: Build channel APK
        id: build_apk
        working-directory: android
        env:
          ANYCLAW_SIGNING_STORE_FILE: ${{ github.workspace }}/android/signing/pocket-lobster-release.p12
          ANYCLAW_SIGNING_STORE_PASSWORD: ${{ secrets.ANYCLAW_SIGNING_STORE_PASSWORD }}
          ANYCLAW_SIGNING_KEY_ALIAS: ${{ secrets.ANYCLAW_SIGNING_KEY_ALIAS }}
          ANYCLAW_SIGNING_KEY_PASSWORD: ${{ secrets.ANYCLAW_SIGNING_KEY_PASSWORD }}
          BUILD_CHANNEL: ${{ github.event.inputs.release_channel || 'beta' }}
        run: |
          CHANNEL="${BUILD_CHANNEL:-beta}"
          if [ "$CHANNEL" = "prod" ]; then
            ./gradlew assembleProdDebug
            APK_SOURCE="app/build/outputs/apk/prod/debug/app-prod-debug.apk"
            APK_NAME="pocket-lobster.apk"
            PACKAGE_ID="com.codex.mobile.pocketlobster"
          elif [ "$CHANNEL" = "test" ]; then
            ./gradlew assembleOperatorDebug
            APK_SOURCE="app/build/outputs/apk/operator/debug/app-operator-debug.apk"
            APK_NAME="pocket-lobster-test.apk"
            PACKAGE_ID="com.codex.mobile.pocketlobster.test"
          else
            ./gradlew :openminis:verifyOpenMinisIntegrationSources :app:testBetaDebugUnitTest assembleBetaDebug
            APK_SOURCE="app/build/outputs/apk/beta/debug/app-beta-debug.apk"
            APK_NAME="pocket-lobster-beta.apk"
            PACKAGE_ID="com.codex.mobile.pocketlobster.beta"
            CHANNEL="beta"
          fi
          if [ ! -f "$APK_SOURCE" ]; then
            echo "APK not found: $APK_SOURCE"
            exit 1
          fi
          mkdir -p app/build/outputs/apk/debug
          cp "$APK_SOURCE" "app/build/outputs/apk/debug/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-lobster-${{ steps.build_apk.outputs.release_channel }}
          path: android/app/build/outputs/apk/debug/${{ steps.build_apk.outputs.apk_name }}

      - name: Verify APK identity and version
        env:
          APK_NAME: ${{ steps.build_apk.outputs.apk_name }}
          EXPECTED_PACKAGE_ID: ${{ steps.build_apk.outputs.package_id }}
          RELEASE_CHANNEL: ${{ steps.build_apk.outputs.release_channel }}
        run: |
          AAPT_BIN="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT_BIN" ] || [ ! -x "$AAPT_BIN" ]; then
            echo "aapt not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          APK_PATH="android/app/build/outputs/apk/debug/$APK_NAME"
          BADGING="$("$AAPT_BIN" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(echo "$BADGING" | head -n 1)"
          echo "$PACKAGE_LINE"
          echo "$PACKAGE_LINE" | grep -F "name='$EXPECTED_PACKAGE_ID'"
          echo "$PACKAGE_LINE" | grep -F "versionCode='311'"
          test "$(echo "$BADGING" | grep -c '^launchable-activity:')" -eq 1
          echo "$BADGING" | grep -F "launchable-activity: name='com.codex.mobile.MainActivity'"
          if echo "$BADGING" | grep -E "^application-label[^:]*:'Minis'$"; then
            echo "OpenMinis must not replace the Pocket Lobster launcher label"
            exit 1
          fi
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            echo "$PACKAGE_LINE" | grep -F "versionName='1.0.70-codex-cli-0.147.0-gpt-5.6-openminis-1.12-collaboration-reliability-v311-beta'"
            echo "$BADGING" | grep -F "application-label:'口袋大龙虾测试版'"
            test "$EXPECTED_PACKAGE_ID" = "com.codex.mobile.pocketlobster.beta"
          fi

      - name: Verify Pocket Lobster and OpenMinis process isolation
        env:
          APK_NAME: ${{ steps.build_apk.outputs.apk_name }}
        run: |
          AAPT_BIN="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK_PATH="android/app/build/outputs/apk/debug/$APK_NAME"
          "$AAPT_BIN" dump xmltree "$APK_PATH" AndroidManifest.xml > /tmp/merged-manifest.txt
          grep -F 'com.codex.mobile.PocketLobsterApplication' /tmp/merged-manifest.txt
          grep -F 'com.codex.mobile.MainActivity' /tmp/merged-manifest.txt
          test "$(grep -c ':minis' /tmp/merged-manifest.txt)" -ge 10
          grep -F 'com.openminis.app.integration.SharedBrowserActivity' /tmp/merged-manifest.txt
          grep -F 'com.openminis.app.integration.MinisRuntimeBridgeService' /tmp/merged-manifest.txt

      - name: Verify shared runtime integration
        run: |
          grep -F 'ShizukuProvider.enableMultiProcessSupport' android/app/src/main/java/com/codex/mobile/PocketLobsterApplication.kt
          grep -F 'ShizukuProvider.requestBinderForNonProviderProcess' android/app/src/main/java/com/codex/mobile/PocketLobsterApplication.kt
          grep -F 'PocketLobsterHostTools.localTerminalDefinition' android/openminis/build.gradle.kts
          grep -F 'PocketLobsterHostTools.ubuntuDefinition' android/openminis/build.gradle.kts
          grep -F 'tool("anyclaw_alpine"' android/app/src/main/assets/anyclaw/claude-toolbox-server.js
          grep -F 'tool("minis_browser"' android/app/src/main/assets/anyclaw/claude-toolbox-server.js
          test -f android/app/src/main/assets/shared-runtime/alpine-shell
          test -f android/app/src/main/assets/shared-runtime/minis-browser
          test -f android/app/src/main/assets/shared-runtime/shared-runtime-cli.js
          grep -F 'WebView.setDataDirectorySuffix' android/app/src/main/java/com/codex/mobile/PocketLobsterApplication.kt
          grep -F 'queueOptimisticUserMessage' src/composables/useDesktopState.ts
          grep -F 'RELIABILITY_SYNC_INTERVAL_MS' src/composables/useDesktopState.ts
          grep -F 'getThreadSnapshot' src/composables/useDesktopState.ts
          grep -F 'registerProvisionalThread' src/composables/useDesktopState.ts
          grep -F 'CODEX_NOTIFICATION_HISTORY_LIMIT' src/server/codexAppServerBridge.ts
          grep -F 'fetchWithTimeout' src/api/codexRpcClient.ts

      - name: Verify OpenMinis runtime payload
        env:
          APK_NAME: ${{ steps.build_apk.outputs.apk_name }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/$APK_NAME"
          unzip -l "$APK_PATH" > /tmp/apk-entries.txt
          grep -E 'assets/alpine-minirootfs\.tar(\.gz)?$' /tmp/apk-entries.txt
          grep -F "assets/proot-aarch64" /tmp/apk-entries.txt
          grep -F "lib/arm64-v8a/libproot.so" /tmp/apk-entries.txt
          grep -F "lib/arm64-v8a/libproot-loader.so" /tmp/apk-entries.txt
          grep -F "lib/arm64-v8a/libproot-loader32.so" /tmp/apk-entries.txt
          grep -F "lib/arm64-v8a/libubuntu_proot.so" /tmp/apk-entries.txt
          grep -F "lib/arm64-v8a/libpty_bridge.so" /tmp/apk-entries.txt
          if grep -F "assets/runtime/openclaw-runtime" /tmp/apk-entries.txt; then
            echo "Legacy OpenClaw runtime must not ship in the Minis replacement build"
            exit 1
          fi

      - name: Verify APK signature
        env:
          APK_NAME: ${{ steps.build_apk.outputs.apk_name }}
        run: |
          APKSIGNER_BIN="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          APK_PATH="android/app/build/outputs/apk/debug/$APK_NAME"
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH"

      - name: Generate changelog
        if: github.ref_type == 'branch'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --reverse)
          else
            CHANGES=$(git log --pretty=format:"- %s" --reverse -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ steps.build_apk.outputs.release_channel }}
          name: "Pocket Lobster ${{ steps.build_apk.outputs.release_channel }} v${{ github.run_number }} (${{ github.ref_name }})"
          target_commitish: ${{ github.sha }}
          body: |
            🦞 **Pocket Lobster** — multi-agent AI on Android

            📱 Install the APK on any ARM64 Android 8.0+ device. No root required.

            Source and license: GNU GPL v3. OpenMinis foundation is pinned in the repository.

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ---
            Channel: ${{ steps.build_apk.outputs.release_channel }}
            Package ID: ${{ steps.build_apk.outputs.package_id }}
            Branch: ${{ github.ref_name }}
            Built from commit ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/${{ steps.build_apk.outputs.apk_name }}
          draft: false
          prerelease: ${{ steps.build_apk.outputs.release_channel != 'prod' }}
